[package]
name = "ink"
version = "0.1.0"
description = "Ink - write and draw in one document"
authors = ["Lenard"]
edition = "2021"

[lib]
name = "ink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
